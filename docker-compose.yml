version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ecoride_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecoride
      MYSQL_USER: ecoride_user
      MYSQL_PASSWORD: ecoride_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ecoride_network

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecoride_php
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - mysql
    networks:
      - ecoride_network
    environment:
      - DB_HOST=mysql
      - DB_NAME=ecoride
      - DB_USER=ecoride_user
      - DB_PASS=ecoride_pass

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecoride_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:8080/api
    networks:
      - ecoride_network

volumes:
  mysql_data:

networks:
  ecoride_network:
    driver: bridge